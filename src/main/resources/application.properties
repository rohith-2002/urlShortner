spring.application.name=urlShortner
server.port=8080

# Datasource (use environment variables only for credentials)
# Keep URL and driver configurable via env if needed, but default to localhost for dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortnerdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings (local defaults)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Application settings
app.base-url=http://localhost:8080

# NOTES:
# - Only DB credentials (SPRING_DATASOURCE_URL, DB_USER, DB_PASSWORD) are read from env vars.
# - For local development, populate these via application-local.properties or environment variables.
# - Do NOT commit production credentials into source control.
